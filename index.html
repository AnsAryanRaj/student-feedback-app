<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Feedback App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <div class="icon">🎓</div>

            <h1>Student Feedback</h1>

            <p>
                Share your valuable feedback with us
            </p>
        </div>


        <form id="feedbackForm">

            <!-- Student Name -->
            <div class="form-group">
                <label for="name">Student Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                    minlength="2"
                >
            </div>


            <!-- Student Email -->
            <div class="form-group">
                <label for="email">Student Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@niet.co.in"
                    pattern="[A-Za-z0-9._%+-]+@niet\.co\.in"
                    title="Please enter your NIET email in the format: example@niet.co.in"
                    required
                >

                <small>
                    Use your NIET email address
                </small>
            </div>


            <!-- Course -->
            <div class="form-group">
                <label for="course">Course</label>

                <input
                    type="text"
                    id="course"
                    placeholder="Enter your course"
                    required
                >
            </div>


            <!-- Feedback -->
            <div class="form-group">
                <label for="feedback">Feedback</label>

                <textarea
                    id="feedback"
                    placeholder="Write your feedback here..."
                    required
                    minlength="5"
                ></textarea>
            </div>


            <button type="submit">
                Submit Feedback
            </button>

        </form>


        <!-- Submitted Feedback -->
        <div id="submittedFeedback"></div>

    </div>


    <script src="script.js"></script>

</body>
</html>
